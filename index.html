<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry Potter - B2 Almanca Okuyucu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        .story-text {
            font-family: 'Merriweather', serif;
            line-height: 2.2;
            font-size: 1.125rem;
            text-align: justify;
        }

        .clickable-word {
            cursor: pointer;
            border-radius: 0.25rem;
            padding: 0.125rem 0.2rem;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .clickable-word:hover {
            background-color: #c7d2fe;
            color: #312e81;
        }

        .active-word {
            background-color: #4f46e5;
            color: white;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.4);
        }

        #translation-panel {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            40% { color: inherit; text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            60% { text-shadow: .25em 0 0 inherit, .5em 0 0 rgba(0,0,0,0); }
            80%, 100% { text-shadow: .25em 0 0 inherit, .5em 0 0 inherit; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Karşılama Ekranı Animasyonları */
        .neon-text {
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.8), 0 0 20px rgba(250, 204, 21, 0.4);
            animation: pulse-neon 2s infinite alternate;
        }

        @keyframes pulse-neon {
            from { text-shadow: 0 0 10px rgba(250, 204, 21, 0.8), 0 0 20px rgba(250, 204, 21, 0.4); }
            to { text-shadow: 0 0 20px rgba(250, 204, 21, 1), 0 0 40px rgba(250, 204, 21, 0.6); }
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden bg-[#fbfbfe]">

    <!-- ========================================== -->
    <!-- KARŞILAMA EKRANI (İLTER İÇİN) -->
    <!-- ========================================== -->
    <div id="welcome-overlay" class="fixed inset-0 z-[100] bg-slate-900 flex flex-col items-center justify-center p-4 transition-opacity duration-700">
        
        <h1 class="text-4xl md:text-6xl font-bold text-yellow-400 mb-6 text-center tracking-widest neon-text">
            İLTER <br class="md:hidden"/> hoş GELDİN GÜLÜM
        </h1>
        
        <!-- MP4 Video Alanı -->
        <div class="w-full max-w-2xl aspect-video bg-black rounded-2xl overflow-hidden shadow-[0_0_30px_rgba(0,0,0,0.8)] mb-8 border-4 border-slate-700 relative flex items-center justify-center">
            
            <!-- Video Yüklenmezse Görünecek Mesaj -->
            <div class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 z-0 p-4 text-center">
                <i class="fa-solid fa-video-slash text-4xl mb-2"></i>
                <p class="text-sm">Video yüklenemedi. GitHub'a <b>ilter_video.mp4</b> adında bir video yüklediğinden emin ol.</p>
            </div>

            <!-- Yerel Video Etiketi -->
            <video id="welcome-video" class="w-full h-full object-contain relative z-10" autoplay loop controls playsinline>
                <source src="./ilter_video.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Maceraya Başla Butonu -->
        <button id="start-btn" class="px-8 py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full text-xl font-bold shadow-[0_0_20px_rgba(79,70,229,0.5)] transition-all hover:scale-105 flex items-center gap-3 border-2 border-indigo-400">
            <i class="fa-solid fa-book-open-reader"></i> Maceraya Başla
        </button>
    </div>
    <!-- ========================================== -->


    <!-- Üst Menü -->
    <header class="bg-slate-900 text-white p-4 shadow-lg z-20 flex flex-col md:flex-row justify-between items-center shrink-0 gap-4">
        <div class="flex items-center gap-3 w-full md:w-auto">
            <i class="fa-solid fa-bolt text-yellow-400 text-2xl"></i>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Harry Potter Okuyucu</h1>
                <p class="text-xs text-slate-400">B2 Seviyesi / TestDaF Hazırlık</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3 w-full md:w-auto justify-center md:justify-end bg-slate-800 p-1.5 rounded-xl border border-slate-700">
            <button id="prev-page" class="px-4 py-2 text-slate-300 hover:text-white hover:bg-slate-700 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline font-medium">Önceki</span>
            </button>
            <div class="px-4 py-1 bg-slate-900 rounded-lg text-sm font-semibold text-yellow-400 border border-slate-700 shadow-inner">
                Sayfa <span id="current-page">1</span> / <span id="total-pages">20</span>
            </div>
            <button id="next-page" class="px-4 py-2 text-slate-300 hover:text-white hover:bg-slate-700 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                <span class="hidden sm:inline font-medium">Sonraki</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </header>

    <!-- Ana Metin Alanı -->
    <main class="flex-1 overflow-y-auto p-5 md:p-12 relative" id="main-scroll">
        <div class="max-w-3xl mx-auto">
            <div id="story-content" class="story-text pb-32 text-slate-800">
                <!-- Javascript ile doldurulacak -->
            </div>
        </div>
    </main>

    <!-- Çeviri Paneli -->
    <div id="translation-panel" class="fixed bottom-0 left-0 w-full bg-white shadow-[0_-15px_50px_rgba(0,0,0,0.2)] transform translate-y-full rounded-t-3xl border-t border-slate-200 z-50 md:max-w-md md:left-auto md:right-8 md:bottom-8 md:rounded-2xl md:translate-y-[150%]">
        <div class="p-6">
            <div class="flex justify-between items-start mb-4">
                <h2 id="word-title" class="text-3xl font-bold text-indigo-900 capitalize tracking-tight border-b-2 border-indigo-100 pb-2">Kelime</h2>
                <button id="close-panel" class="text-slate-400 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-full w-10 h-10 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div id="translation-content" class="text-slate-700 text-base">
                <!-- Çeviri sonucu buraya yüklenecek -->
            </div>
        </div>
    </div>

    <script>
        // API KEY
        const apiKey = ""; 

        // --- KARŞILAMA EKRANI KONTROLLERİ ---
        const welcomeOverlay = document.getElementById('welcome-overlay');
        const startBtn = document.getElementById('start-btn');
        const welcomeVideo = document.getElementById('welcome-video');

        startBtn.addEventListener('click', () => {
            // Butona basıldığında videoyu durdur
            welcomeVideo.pause();
            
            // Ekranı yumuşak bir şekilde gizle
            welcomeOverlay.classList.add('opacity-0');
            
            setTimeout(() => {
                welcomeOverlay.classList.add('hidden');
            }, 700);
        });
        // ------------------------------------

        // KİTABIN GÖMÜLÜ METNİ (Tam 20 Sayfa)
        const bookPages = [
            `ERSTER AKT, ERSTE SZENE. BAHNHOF KING'S CROSS.
Ein überfüllter, geschäftiger Bahnhof. Überall Menschen, die versuchen, irgendwohin zu gelangen. Inmitten des Trubels rattern zwei große Käfige auf zwei schwer beladenen Gepäckwagen. Sie werden geschoben von zwei Jungen, JAMES POTTER und ALBUS POTTER. Ihre Mutter, GINNY, folgt ihnen. Der neununddreißigjährige HARRY trägt seine Tochter LILY auf den Schultern.
ALBUS: Dad. Er sagt es schon wieder.
HARRY: James, hör auf damit.
JAMES: Ich hab doch nur gesagt, dass er nach Slytherin kommen könnte. Das könnte er ja auch... (Auf den finsteren Blick seines Vaters hin) Schon gut.
ALBUS (sieht zu seiner Mutter auf): Du schreibst mir doch, oder?
GINNY: Jeden Tag, wenn du willst.
ALBUS: Nein. Nicht jeden Tag. James sagt, die meisten Leute kriegen nur einmal im Monat Post von zu Hause. Ich will nicht, dass...
HARRY: Wir haben deinem Bruder letztes Jahr dreimal in der Woche geschrieben.
ALBUS: Was? James!
ALBUS sieht JAMES anfragend an.
GINNY: Glaub nicht alles, was er dir über Hogwarts erzählt. Dein Bruder scherzt gerne.`,
            
            `ERSTER AKT, ZWEITE SZENE. BAHNSTEIG NEUN DREIVIERTEL.
Die Familie Potter steht vor der Barriere zwischen den Bahnsteigen neun und zehn.
HARRY: Du musst nur genau zwischen Gleis neun und zehn auf die Absperrung zugehen.
LILY: Ich bin so aufgeregt!
HARRY: Mach dir keine Sorgen. Geht am besten im Laufschritt, wenn ihr nervös seid.
ALBUS und JAMES rennen auf die Barriere zu. Sie verschwinden. HARRY und GINNY folgen ihnen. Dichter weißer Dampf verhüllt alles. Als er sich lichtet, sehen wir den Hogwarts-Express.
ALBUS: Das ist also der Hogwarts-Express.
ROSE WEASLEY kommt mit ihren Eltern RON und HERMINE heran.
RON: Wenn das nicht mein Lieblingsneffe ist!
ALBUS: Hallo, Onkel Ron.
HERMINE: Hast du alles eingepackt? Auch genug zum Anziehen?
ALBUS: Ja, Tante Hermine.
ROSE: Albus, wir müssen uns im Zug unbedingt beeilen und gute Plätze finden. Unsere Eltern waren berühmt. Wir müssen die richtigen Leute kennenlernen.`,

            `ERSTER AKT, DRITTE SZENE. DER HOGWARTS-EXPRESS.
ALBUS und ROSE gehen den Gang entlang. Sie schauen in verschiedene Abteile.
ROSE: Dieser Waggon ist voll. Lass uns weitergehen.
Sie öffnen eine weitere Tür. Darin sitzt ein einzelner Junge, SCORPIUS MALFOY. Er ist blass und hat hellblondes Haar.
SCORPIUS: Hallo. Hier ist noch frei.
ALBUS: Danke. (Er setzt sich)
ROSE (zögert): Hallo. Ich bin Rose. Und das ist Albus.
SCORPIUS: Ich bin Scorpius. Ich habe ein paar Süßigkeiten. Wollt ihr Schokofrösche?
ROSE: Nein, danke. Wir haben schon gefrühstückt.
SCORPIUS: Meine Eltern haben mir erzählt, wer ihr seid. Ihr seid die Kinder von Harry Potter und Ron Weasley.
ALBUS: Und wer bist du?
SCORPIUS: Scorpius Malfoy. Mein Vater ist Draco Malfoy.
ROSE starrt ihn an. Die Gerüchte über die Malfoys sind ihr bekannt.
ROSE: Albus, wir sollten vielleicht woanders suchen.
ALBUS: Mir gefällt es hier. Bleib ruhig, Scorpius.`,

            `ERSTER AKT, VIERTE SZENE. DIE GROßE HALLE.
Schüler sitzen an den vier langen Tischen. Professor McGonagall steht vorne mit dem Sprechenden Hut.
MCGONAGALL: Wenn ich euren Namen aufrufe, tretet ihr vor. Ich setze euch den Hut auf und ihr werdet in eure Häuser eingeteilt. ROSE WEASLEY!
Rose tritt nervös vor. Der Hut wird ihr auf den Kopf gesetzt.
SPRECHENDER HUT: Ah, eine Weasley. Das ist nicht schwer... GRYFFINDOR!
Der Gryffindor-Tisch jubelt.
MCGONAGALL: SCORPIUS MALFOY!
Scorpius setzt sich.
SPRECHENDER HUT: Ein Malfoy, ganz klar. SLYTHERIN!
Der Slytherin-Tisch klatscht.
MCGONAGALL: ALBUS POTTER!
Es wird totenstill in der Halle. Albus tritt vor. Er zittert leicht. Der Hut wird ihm aufgesetzt.
SPRECHENDER HUT: Schwierig. Sehr schwierig. Du hast viel Mut, aber auch einen starken Willen, dich zu beweisen. SLYTHERIN!
Tiefes Schweigen im Saal. Ein Potter in Slytherin? Das ist noch nie passiert. Scorpius lächelt ihm schüchtern zu.`,

            `ERSTER AKT, FÜNFTE SZENE. HOGWARTS, FLUGSTUNDE.
Die Schüler der ersten Klasse stehen im Hof neben ihren Besen. MADAM HOOCH betritt den Platz.
MADAM HOOCH: Willkommen zur ersten Flugstunde. Nun, worauf wartet ihr noch? Tretet an eure Besen. Streckt die rechte Hand über den Besen aus und sagt: Auf!
ALLE: Auf!
Roses und Scorpius' Besen fliegen sofort in ihre Hände. Albus' Besen bewegt sich keinen Zentimeter.
ALBUS: Auf. Auf! AUF!
Der Besen bleibt auf dem Boden liegen. Einige Schüler kichern.
MADAM HOOCH: Konzentration, Mister Potter. Fühlen Sie die Magie.
Albus schaut frustriert zu Boden. Er hasst es, im Mittelpunkt zu stehen, besonders wenn er versagt. Die ständigen Vergleiche mit seinem berühmten Vater lasten schwer auf ihm. Scorpius klopft ihm tröstend auf die Schulter.
SCORPIUS: Das wird schon, Albus. Wir üben einfach später zusammen.`,

            `ERSTER AKT, SECHSTE SZENE. BAHNSTEIG NEUN DREIVIERTEL.
Die Jahre vergehen. Wir sehen ALBUS und HARRY auf dem Bahnsteig. Albus sieht älter und unglücklicher aus.
HARRY: Drittes Jahr. Das wird ein gutes Jahr, Albus. Da bin ich mir sicher.
ALBUS: Warum sollte es das sein? Letztes Jahr war furchtbar. Die Leute starren mich an. Sie flüstern. 'Der Sohn von Harry Potter, ein Slytherin.' 'Der Sohn von Harry Potter, der nicht einmal zaubern kann.'
HARRY: Sie flüstern nicht nur über dich, Albus.
ALBUS: Nein. Sie flüstern über uns beide. Über die Enttäuschung, die ich für dich bin.
HARRY (seufzt): Du bist keine Enttäuschung für mich, Albus.
ALBUS dreht sich weg.
ALBUS: Lass mich einfach in Ruhe, Dad. Ich muss in den Zug.
HARRY sieht ihm nach, hilflos. GINNY tritt neben ihn.
GINNY: Er ist wütend, Harry. Gib ihm Zeit.
HARRY: Ich weiß einfach nicht, wie ich mit ihm reden soll. Jedes Mal, wenn ich es versuche, wird es schlimmer.`,

            `ERSTER AKT, SIEBTE SZENE. HARRY POTTERS BÜRO IM MINISTERIUM.
HARRY sitzt an seinem Schreibtisch. Papierstapel türmen sich. HERMINE tritt ein.
HERMINE: Harry, du arbeitest zu viel. Das ist nicht gut für dich.
HARRY: Ich muss diese Berichte fertigstellen. Es gab wieder Zwischenfälle.
Ein alter Mann im Rollstuhl wird hereingeschoben. Es ist AMOS DIGGORY.
AMOS: Harry Potter.
HARRY: Amos. Was führt dich hierher?
AMOS: Ich habe Gerüchte gehört. Gerüchte über einen illegalen Zeitumkehrer, der vom Ministerium beschlagnahmt wurde.
HARRY (zögert): Das sind nur Gerüchte, Amos. Alle Zeitumkehrer wurden vor Jahren zerstört.
AMOS: Lüg mich nicht an, Potter! Ich weiß, dass ihr einen habt. Und ich will ihn nutzen.
HARRY: Wofür?
AMOS: Für meinen Sohn. Für Cedric. Er ist gestorben, weil er bei dir war. Du hättest ihn retten können. Jetzt will ich in die Vergangenheit reisen und ihn zurückholen.
HARRY: Das ist unmöglich. Die Zeit zu ändern ist extrem gefährlich. Das weißt du.`,

            `ERSTER AKT, ACHTE SZENE. HARRY POTTERS BÜRO IM MINISTERIUM.
HARRY (zu Amos): Ich kann dir nicht helfen, Amos. Es tut mir leid um Cedric, wirklich. Aber ich kann dir keinen Zeitumkehrer geben.
AMOS: Du willst mir nicht helfen! Du hast deinen Sohn, Harry. Ich habe meinen verloren.
Eine junge Frau tritt hinter Amos hervor. Sie hat silberblaues Haar.
DELPHI: Onkel Amos, reg dich nicht auf. Es ist nicht gut für dein Herz.
HARRY: Wer bist du?
DELPHI: Ich bin Delphini Diggory. Seine Nichte. Ich pflege ihn. Wir sollten jetzt gehen, Onkel Amos. Mister Potter hat uns seine Antwort gegeben.
Amos wird hinausgeschoben. HARRY bleibt nachdenklich zurück. Er bemerkt nicht, dass ALBUS an der Tür gelauscht hat.
ALBUS (zu sich selbst): Er hat also einen Zeitumkehrer. Und er weigert sich, einen Fehler aus der Vergangenheit zu korrigieren. Er weigert sich, Cedric zu retten.`,

            `ERSTER AKT, NEUNTE SZENE. HOGWARTS-EXPRESS.
ALBUS betritt das Abteil, in dem SCORPIUS sitzt.
ALBUS: Ich hab eine Idee, Scorpius. Eine verrückte Idee.
SCORPIUS: Verrückt ist mein zweiter Vorname. Was gibt es?
ALBUS: Hast du schon mal von Amos Diggory gehört?
SCORPIUS: Der Vater von Cedric Diggory? Ja, er ist in meinem Geschichtsbuch. Cedric starb während des Trimagischen Turniers.
ALBUS: Mein Vater hätte ihn retten können. Er hat es nicht getan. Aber wir können es tun.
SCORPIUS: Wie?
ALBUS: Mein Vater hat einen Zeitumkehrer im Ministerium versteckt. Amos Diggory hat ihn gebeten, ihn zu benutzen, aber mein Vater hat abgelehnt.
SCORPIUS: Die Zeit zu ändern ist gefährlich, Albus. Davon steht auch etwas in meinen Büchern.
ALBUS: Scorpius, mein Vater ist kein Held. Er macht Fehler. Ich werde diesen Fehler korrigieren. Ich werde Cedric retten. Und ich brauche deine Hilfe.`,

            `ERSTER AKT, ZEHNTE SZENE. DAS DACH DES HOGWARTS-EXPRESS.
ALBUS und SCORPIUS sind aus dem Fenster geklettert und befinden sich nun auf dem fahrenden Zug.
SCORPIUS: Albus, das ist lebensmüde! Wir werden vom Zug fallen!
ALBUS: Wir müssen abspringen, bevor wir in Hogwarts ankommen. Wir müssen zu Amos Diggory.
Plötzlich erscheint eine ältere Frau auf dem Dach. Es ist die IMBISSWAGEN-HEXE.
IMBISSWAGEN-HEXE: Süßigkeiten, meine Herren?
SCORPIUS: Wie sind Sie hier hochgekommen?
IMBISSWAGEN-HEXE: Ich bin seit über hundert Jahren auf diesem Zug. Niemand verlässt den Hogwarts-Express, bevor er sein Ziel erreicht hat. Meine Kürbispasteten können sich in Waffen verwandeln. (Ihre Hände verwandeln sich in scharfe Krallen)
ALBUS: Wir müssen springen, Scorpius! Jetzt!
Sie rennen an den Rand des Waggons. Die Hexe wirft mit explosiven Pasteten nach ihnen.
ALBUS und SCORPIUS springen in die Dunkelheit hinab.`,

            `ERSTER AKT, ELFTE SZENE. ST. OSWALDS HEIM FÜR ALTE HEXEN UND ZAUBERER.
ALBUS und SCORPIUS betreten ein etwas heruntergekommenes, aber magisches Altersheim. Zauberstäbe stricken von selbst Pullover.
DELPHI kommt den Gang entlang.
DELPHI: Ihr seid es. Die Jungs aus Hogwarts.
ALBUS: Wir suchen Amos Diggory.
DELPHI: Kommt mit mir.
Sie führt die beiden in ein Zimmer. AMOS sitzt in seinem Rollstuhl.
AMOS: Was wollt ihr hier? Potter-Junge.
ALBUS: Ich habe gehört, was Sie zu meinem Vater gesagt haben. Dass er Cedric hätte retten können.
AMOS: Ja. Und er hat sich geweigert.
ALBUS: Ich weigere mich nicht. Wir werden den Zeitumkehrer besorgen. Wir werden in die Vergangenheit reisen und Ihren Sohn retten.
AMOS starrt Albus an. Eine Mischung aus Unglaube und Hoffnung erscheint auf seinem Gesicht.
AMOS: Du würdest das tun? Für mich?
ALBUS: Ich werde beweisen, dass mein Vater nicht perfekt ist. Und dass ich mehr bin als nur eine Enttäuschung.`,

            `ERSTER AKT, ZWÖLFTE SZENE. MINISTERIUM FÜR ZAUBEREI, HERMINES BÜRO.
HARRY, RON, HERMINE und DRACO MALFOY stehen im Büro.
DRACO: Wo sind sie? Mein Sohn ist verschwunden, Potter!
HARRY: Albus ist auch verschwunden. Sie sind nicht im Zug angekommen.
HERMINE: Wir haben Auroren ausgeschickt. Sie durchsuchen die Gegend um Hogwarts und den Bahnhof.
DRACO: Es gibt Gerüchte über mein Blut, Granger. Dass Scorpius der Sohn von Voldemort sei. Diese Gerüchte zerstören ihn. Und jetzt ist er weg.
HARRY: Das sind Lügen, Draco. Wir wissen das.
DRACO: Das Ministerium muss eine offizielle Erklärung abgeben. Ihr müsst sagen, dass alle Zeitumkehrer zerstört wurden. Dass Voldemort keine Erben hat.
HERMINE (leise): Wir können das nicht sagen, Draco.
DRACO: Warum nicht?
HERMINE: Weil wir einen Zeitumkehrer gefunden haben. Einen echten. Er liegt hier in diesem Büro.
DRACO sieht sie fassungslos an.`,

            `ERSTER AKT, DREIZEHNTE SZENE. VOR DEM ZAUBEREIMINISTERIUM.
ALBUS, SCORPIUS und DELPHI stehen versteckt vor dem Eingang.
DELPHI: Wir müssen Vielsaft-Trank benutzen, um unbemerkt hineinzukommen.
ALBUS: Ich habe Haare von meinem Onkel Ron besorgt. Du kannst mein Vater sein, Scorpius.
SCORPIUS: Ich? Harry Potter? Das wird niemals funktionieren.
DELPHI: Es muss. Wir trinken den Trank jetzt.
Sie trinken aus kleinen Fläschchen. Ihre Gesichter verzerren sich. Albus verwandelt sich in Ron, Scorpius in Harry und Delphi in Hermine.
SCORPIUS (mit Harrys Stimme): Das ist so seltsam. Ich sehe aus wie du, Albus. Ich meine, wie dein Vater.
DELPHI (mit Hermines Stimme): Konzentriert euch. Wir müssen ins Büro von Hermine Granger. Dort ist der Zeitumkehrer versteckt.
ALBUS (als Ron): Lasst uns reingehen und die Welt verändern.`,

            `ERSTER AKT, VIERZEHNTE SZENE. MINISTERIUM, HERMINES BÜRO.
ALBUS (Ron), SCORPIUS (Harry) und DELPHI (Hermine) durchsuchen das Büro.
SCORPIUS: Es muss hier irgendwo sein. Hermine würde so etwas Wichtiges nicht einfach herumliegen lassen.
DELPHI: Schaut euch die Bücher an. Hermine versteckt Dinge oft in Rätseln.
Sie untersuchen das Bücherregal. Ein Buch beißt Albus fast in die Hand.
ALBUS: Au! Diese Bücher sind gefährlich.
SCORPIUS findet ein Buch, das leuchtet. Er zieht es heraus. Das Bücherregal öffnet sich und gibt den Blick auf ein verstecktes Fach frei.
SCORPIUS: Ich hab ihn!
Er holt eine kleine, goldene Sanduhr heraus. Der Zeitumkehrer.
DELPHI: Fantastisch! Jetzt müssen wir nur noch herausfinden, wie er funktioniert. Er sieht anders aus als die alten Modelle.
ALBUS: Wir haben ihn. Wir können Cedric retten.`,

            `ZWEITER AKT, ERSTE SZENE. DER VERBOTENE WALD.
HARRY geht mit einer Laterne durch den dunklen Wald. Er sucht nach Albus. Plötzlich taucht ein Zentaur auf. Es ist BANE.
BANE: Harry Potter. Du solltest nicht hier sein.
HARRY: Bane. Mein Sohn ist verschwunden. Hast du ihn gesehen?
BANE: Die Sterne reden, Harry Potter. Aber sie reden nicht von deinem Sohn. Sie reden von einer dunklen Wolke.
HARRY: Was meinst du damit?
BANE: Es gibt einen Schatten um deinen Sohn. Einen schwarzen Schatten. Eine Gefahr, die aus der Vergangenheit zurückkehrt. Du musst ihn von dem Jungen fernhalten.

        // --- DOM ELEMENTLERİ ---
        const storyContent = document.getElementById('story-content');
        const prevPageBtn = document.getElementById('prev-page');
        const nextPageBtn = document.getElementById('next-page');
        const currentPageEl = document.getElementById('current-page');
        const mainScroll = document.getElementById('main-scroll');
        
        const translationPanel = document.getElementById('translation-panel');
        const closePanelBtn = document.getElementById('close-panel');
        const translationContainer = document.getElementById('translation-content');
        const wordTitle = document.getElementById('word-title');

        let currentPageIndex = 0;
        let currentActiveSpan = null;

        function initApp() {
            renderPage(currentPageIndex);
            
            prevPageBtn.addEventListener('click', () => {
                if(currentPageIndex > 0) {
                    currentPageIndex--;
                    renderPage(currentPageIndex);
                }
            });

            nextPageBtn.addEventListener('click', () => {
                if(currentPageIndex < bookPages.length - 1) {
                    currentPageIndex++;
                    renderPage(currentPageIndex);
                }
            });
        }

        function renderPage(index) {
            prevPageBtn.disabled = index === 0;
            nextPageBtn.disabled = index === bookPages.length - 1;
            currentPageEl.textContent = index + 1;
            
            const rawText = bookPages[index];
            const paragraphs = rawText.split('\n');
            let formattedHTML = '';

            paragraphs.forEach(p => {
                if(p.trim() === '') {
                    formattedHTML += '<br>';
                    return;
                }
                
                const parts = p.split(/([a-zA-ZäöüÄÖÜß]+)/);
                let paragraphHTML = '';
                
                parts.forEach(part => {
                    if (/^[a-zA-ZäöüÄÖÜß]+$/.test(part)) {
                        paragraphHTML += `<span class="clickable-word">${part}</span>`;
                    } else {
                        paragraphHTML += part;
                    }
                });
                
                formattedHTML += `<p class="mb-5">${paragraphHTML}</p>`;
            });

            storyContent.innerHTML = formattedHTML;
            mainScroll.scrollTop = 0; 
            closePanel(); 
            attachWordListeners();
        }

        function attachWordListeners() {
            const words = storyContent.querySelectorAll('.clickable-word');
            words.forEach(span => {
                span.addEventListener('click', () => {
                    const contextText = span.parentElement.textContent || span.textContent;
                    handleWordClick(span, span.textContent, contextText);
                });
            });
        }

        async function handleWordClick(spanElement, word, contextParagraph) {
            if(currentActiveSpan) {
                currentActiveSpan.classList.remove('active-word');
            }
            spanElement.classList.add('active-word');
            currentActiveSpan = spanElement;

            wordTitle.textContent = word;
            openPanel();
            
            translationContainer.innerHTML = `
                <div class="flex flex-col items-center justify-center gap-3 text-indigo-600 font-semibold py-8">
                    <i class="fa-solid fa-spinner fa-spin text-3xl"></i>
                    <span class="loading-dots text-lg">TestDaF / B2 kelime analizi hazırlanıyor</span>
                </div>
            `;

            await fetchTranslation(word, contextParagraph);
        }

        function openPanel() {
            translationPanel.classList.remove('translate-y-full');
            if (window.innerWidth >= 768) {
                translationPanel.classList.remove('md:translate-y-[150%]');
            }
        }

        function closePanel() {
            translationPanel.classList.add('translate-y-full');
            if (window.innerWidth >= 768) {
                translationPanel.classList.add('md:translate-y-[150%]');
            }
            if(currentActiveSpan) {
                currentActiveSpan.classList.remove('active-word');
                currentActiveSpan = null;
            }
        }

        closePanelBtn.addEventListener('click', closePanel);

        async function fetchWithRetry(url, options, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        async function fetchTranslation(word, context) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const systemPrompt = `Sen bir Almanca uzmanısın. Öğrencinin seviyesi B2 ve TestDaF'a hazırlanıyor. Kelimeleri ezberlemek istiyor. Kuru sözlük anlamı verme, teori anlatma, gereksiz giriş çıkış cümlesi KULLANMA.

Öğrenciye kelimeyi AŞAĞIDAKİ FORMATTA VE BU BAŞLIKLARLA ver:
1. Anlamı: (Türkçe tam karşılığı)
2. Kalıbı: (Almancada en çok birlikte kullanıldığı fiil veya tamlama)
3. Örnek Cümle: (Bu kalıpla kurulmuş, günlük hayattan, kısa ve akılda kalıcı bir B2 cümlesi + Türkçe çevirisi)

Ekstra hiçbir selamlama veya kapanış metni yazma. Sadece 3 maddeyi ver.`;

            const userPrompt = `Açıklanacak kelime: "${word}"
Geçtiği cümle bağlamı: "${context}"`;

            const payload = {
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            try {
                const data = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if(rawText) {
                    translationContainer.innerHTML = formatAIResponse(rawText);
                } else {
                    throw new Error("Boş yanıt geldi");
                }
            } catch (error) {
                console.error("API Error:", error);
                translationContainer.innerHTML = `
                    <div class="p-4 bg-red-50 text-red-600 rounded-xl flex items-start gap-3 border border-red-100">
                        <i class="fa-solid fa-triangle-exclamation mt-1"></i>
                        <div>
                            <p class="font-bold">Bağlantı Hatası</p>
                            <p class="text-sm mt-1">Kelime açıklaması şu an alınamıyor. Lütfen tekrar tıkla.</p>
                        </div>
                    </div>
                `;
            }
        }

        function formatAIResponse(text) {
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<b class="font-bold text-slate-900">$1</b>');
            formatted = formatted.replace(/\n/g, '<br>');
            return `
                <div class="bg-white p-5 rounded-xl border border-slate-200 text-[16px] leading-relaxed shadow-sm text-slate-800">
                    ${formatted}
                </div>
            `;
        }

        window.onload = initApp;
    </script>
</body>
